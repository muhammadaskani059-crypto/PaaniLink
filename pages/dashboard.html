
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dashboard | PaaniLink</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome --> 
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link href="../assets/css/style.css" rel="stylesheet">
</head>

<body>

    <div class="app-shell">

        <!-- Sidebar -->
        <aside class="sidebar">

            <a class="side-brand" href="../index.html">
                💧 PaaniLink
            </a>

            <nav id="sideNav" class="side-nav"></nav>

        </aside>

        <!-- Main Area -->
        <main class="main-area">

            <!-- Topbar -->
            <header class="topbar">

                <div>
                    <div class="fw-bold" id="welcome">
                        Dashboard
                    </div>

                    <small class="text-secondary" id="roleLabel"></small>
                </div>

                <!-- Logout Button -->
                <button
                    class="btn btn-outline-secondary btn-sm"
                    id="logoutBtn"
                >
                    <i class="fa-solid fa-right-from-bracket me-1"></i>
                    Logout
                </button>

            </header>

            <!-- Page Content -->
            <section class="content-wrap">

                <div id="appMessage" role="status"></div>

                <div id="pageContent">
                    <div class="text-center p-5">
                        Loading dashboard...
                    </div>
                </div>

            </section>

        </main>

    </div>

    <!-- Custom JavaScript -->
    <script type="module" src="../assets/js/app.js"></script>

</body>
</html>
