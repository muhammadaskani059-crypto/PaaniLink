
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register | PaaniLink</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body class="auth-bg">

    <main class="auth-card">

        <a href="index.html" class="brand-link">
            💧 PaaniLink
        </a>

        <h2 class="mt-3">Create customer account</h2>

        <p class="text-secondary">
            Enter your details to get started.
        </p>

        <form id="registerForm" novalidate>

            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label" for="name">
                    Full name
                </label>

                <input
                    class="form-control"
                    id="name"
                    required
                    minlength="3"
                >
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label" for="regEmail">
                    Email
                </label>

                <input
                    class="form-control"
                    id="regEmail"
                    type="email"
                    required
                >
            </div>

            <!-- CNIC -->
            <div class="mb-3">
                <label class="form-label" for="cnic">
                    CNIC (xxxxx-xxxxxxx-x)
                </label>

                <input
                    class="form-control"
                    id="cnic"
                    required
                    pattern="\d{5}-\d{7}-\d"
                >
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
                <label class="form-label" for="phone">
                    Phone number
                </label>

                <input
                    class="form-control"
                    id="phone"
                    required
                    pattern="03\d{9}"
                >
            </div>

            <!-- Address -->
            <div class="mb-3">
                <label class="form-label" for="address">
                    Address
                </label>

                <input
                    class="form-control"
                    id="address"
                    required
                    minlength="8"
                >
            </div>

            <!-- Zone -->
            <div class="mb-3">
                <label class="form-label" for="zoneId">
                    Zone
                </label>

                <select
                    class="form-select"
                    id="zoneId"
                    required
                >
                    <option value="">
                        Loading zones...
                    </option>
                </select>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label" for="regPassword">
                    Password
                </label>

                <input
                    class="form-control"
                    id="regPassword"
                    type="password"
                    required
                    minlength="6"
                >
            </div>

            <!-- Form Message -->
            <div
                id="formMessage"
                class="form-message"
                role="alert"
            ></div>

            <!-- Submit Button -->
            <button class="btn btn-primary w-100">
                Create account
            </button>

        </form>

        <p class="mt-3 text-center">
            Already registered?
            <a href="login.html">Login</a>
        </p>

    </main>

    <!-- JavaScript -->
    <script
        type="module"
        src="assets/js/auth.js"
    ></script>

</body>
</html>
