
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | PaaniLink</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body class="auth-bg">

    <!-- Login Card -->
    <main class="auth-card">

        <!-- Brand -->
        <a href="index.html" class="brand-link">
            💧 PaaniLink
        </a>

        <!-- Heading -->
        <h2 class="mt-3">
            Welcome back
        </h2>

        <p class="text-secondary">
            Sign in to continue to your dashboard.
        </p>

        <!-- Login Form -->
        <form id="loginForm" novalidate>

            <!-- Email Field -->
            <div class="mb-3">

                <label for="email" class="form-label">
                    Email address
                </label>

                <input
                    class="form-control"
                    id="email"
                    type="email"
                    required
                    autocomplete="username"
                >

            </div>

            <!-- Password Field -->
            <div class="mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    class="form-control"
                    id="password"
                    type="password"
                    required
                    minlength="6"
                    autocomplete="current-password"
                >

            </div>

            <!-- Form Message -->
            <div
                id="formMessage"
                class="form-message"
                role="alert"
            ></div>

            <!-- Login Button -->
            <button
                class="btn btn-primary w-100"
                type="submit"
            >
                Login
            </button>

        </form>

        <!-- Register Link -->
        <p class="mt-3 mb-0 text-center">
            New here?
            <a href="register.html">
                Create account
            </a>
        </p>

        <!-- Demo Accounts -->
        <div class="demo-box mt-4">

            <b>
                Demo accounts (password: 123456)
            </b>

            <small>
                customer@paanilink.test ·
                officer@paanilink.test ·
                operator@paanilink.test ·
                driver@paanilink.test ·
                admin@paanilink.test
            </small>

        </div>

    </main>

    <!-- Custom JavaScript -->
    <script type="module" src="assets/js/auth.js"></script>

</body>
</html>
